name: Android verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android API 35 and build tools
        run: |
          sdkmanager --version
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify HSK curriculum data
        run: python3 scripts/check-hsk-data.py
      - name: Run Kotlin unit tests
        run: gradle --no-daemon --stacktrace :core-domain:test
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Run Android Lint
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HanziFlow-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependencies.txt
